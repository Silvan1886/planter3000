# Mosquitto config for Planter 3000
# Install on the broker Pi (Rot, 172.16.33.53) as /etc/mosquitto/conf.d/planter3000.conf
# It is loaded by the default /etc/mosquitto/mosquitto.conf (include_dir /etc/mosquitto/conf.d),
# which already sets persistence, persistence_location and log_dest. Do not repeat those here.

# Accept connections from the network (Mosquitto 2.x only allows localhost by default)
listener 1883 0.0.0.0

# Authentication: every Pi logs in with its own user (see setup.sh)
allow_anonymous false
password_file /etc/mosquitto/passwd

# Authorization: who may read/write which topic
acl_file /etc/mosquitto/acl

# Write retained messages and queued QoS 1/2 messages to disk every 60 s
autosave_interval 60

# Log connects/disconnects (shows when a Pi drops out)
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
log_type error
log_type warning
log_type notice
log_type information
